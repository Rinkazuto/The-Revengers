name: Feature / Task
description: A piece of work to build
title: "[Feature] "
labels: ["feature"]
body:
  - type: dropdown
    id: feature
    attributes:
      label: MVP feature
      options:
        - Bill calculator
        - Solar check (with vs without solar)
        - My readings
        - Setup / other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Frontend
        - Data
        - Tests
        - Docs / Pitch
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
    validations:
      required: true
