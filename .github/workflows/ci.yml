# CI: runs on every PR into submain or main, and on every push to them.
# 1. Builds everything in PowerCheck.slnx and runs the 36 data integrity tests (data/seed).
# 2. Starts the API on a fresh database and checks 16 real results from the CEB data
#    (bill, 400s, solar incl. the 150A/150B with-solar bill, readings).
# A red X on the PR means: don't merge yet.

name: CI

on:
  pull_request:
    branches: [submain, main]
  push:
    branches: [submain, main]

# Read-only: CI can look at the code but can't change the repo, branches or PRs.
permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build API + website + tests
        run: dotnet build PowerCheck.slnx -c Release

      - name: Data integrity tests (data/seed)
        run: dotnet test tests/PowerCheck.DataTests -c Release --no-build

      - name: Start the API (fresh database, seeded from data/seed)
        run: |
          dotnet run --project backend/PowerCheck.Api -c Release --no-build --urls http://localhost:5012 > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5012/health > /dev/null; then echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "API did not start:"; cat api.log; exit 1

      - name: Check real numbers
        run: |
          fail=0
          check() {  # check <name> <expected> <actual>
            if [ "$2" = "$3" ]; then echo "OK   $1 = $3"; else echo "FAIL $1: expected $2, got $3"; fail=1; fi
          }
          bill() { curl -sf -X POST http://localhost:5012/api/bill/calculate -H "Content-Type: application/json" -d "$1" | jq -r .totalRs; }
          status() { curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:5012$1" -H "Content-Type: application/json" -d "$2"; }

          # Bill (worked out by hand from the CEB tariff 110 bands)
          check "bill 200 kWh"            "1216.75" "$(bill '{"monthlyKwh":200}')"
          check "bill 0 kWh = minimum"    "50.6"    "$(bill '{"monthlyKwh":0}')"
          check "bill 25 kWh"             "90.75"   "$(bill '{"monthlyKwh":25}')"

          # Bad input must give 400
          check "bill -1 kWh"             "400" "$(status /api/bill/calculate '{"monthlyKwh":-1}')"
          check "bill 5001 kWh"           "400" "$(status /api/bill/calculate '{"monthlyKwh":5001}')"
          check "unknown tariff"          "400" "$(status /api/bill/calculate '{"monthlyKwh":100,"tariffCode":"999"}')"

          # Solar answers, and its without-solar bill matches the bill endpoint
          check "solar 200 kWh"           "200" "$(status /api/solar/estimate '{"monthlyKwh":200,"systemSizeKwp":3}')"
          without=$(curl -sf -X POST http://localhost:5012/api/solar/estimate -H "Content-Type: application/json" -d '{"monthlyKwh":200,"systemSizeKwp":3}' | jq -r .withoutSolar.monthlyBillRs)
          check "solar without = bill"    "1216.75" "$without"
          check "solar size 3.3"          "400" "$(status /api/solar/estimate '{"monthlyKwh":200,"systemSizeKwp":3.3}')"

          # Solar on prosumer tariff 150A/150B (GN 473/2026). Money compared in cents so 211.6 and 211.60 both match.
          solar() { curl -sf -X POST http://localhost:5012/api/solar/estimate -H "Content-Type: application/json" -d "$1" | jq -r "$2 * 100 | round"; }
          check "150A: 200 kWh + 3 kWp with-solar bill (cents)"  "21160"  "$(solar '{"monthlyKwh":200,"systemSizeKwp":3}' .withSolar.monthlyBillRs)"
          check "150A: 200 kWh + 3 kWp savings (cents)"          "100515" "$(solar '{"monthlyKwh":200,"systemSizeKwp":3}' .monthlySavingsRs)"
          check "150A: 50 kWh minimum Rs 50.60 (cents)"          "5060"   "$(solar '{"monthlyKwh":50,"systemSizeKwp":3}' .withSolar.monthlyBillRs)"
          check "150B: three-phase minimum Rs 424.35 (cents)"    "42435"  "$(solar '{"monthlyKwh":200,"systemSizeKwp":3,"phase":"three"}' .withSolar.monthlyBillRs)"
          check "phase x"                                        "400"    "$(status /api/solar/estimate '{"monthlyKwh":200,"phase":"x"}')"

          # Readings
          check "save reading"            "201" "$(status /api/readings '{"month":"2026-01","kwh":200}')"
          check "future month"            "400" "$(status /api/readings '{"month":"2099-01","kwh":200}')"

          if [ $fail = 1 ]; then echo "--- API log ---"; cat api.log; exit 1; fi
